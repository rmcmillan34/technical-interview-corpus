schema_version: 0.1.0
role: swe
policy:
  graph_type: directed-many-to-many
  principles:
  - Questions remain independently reusable; progression is modeled separately.
  - Escalation may skip a level when the candidate has already demonstrated prerequisite knowledge.
  - Recovery edges point toward narrower prerequisite checks after a weak answer.
  - Not every D1 node requires a descendant at every higher difficulty.
  - Higher-difficulty questions may converge several foundational concepts.
