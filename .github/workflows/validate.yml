name: Validate corpus

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate corpus
        run: python tools/validate.py

      - name: Build preview release bundle
        run: python tools/build_release.py --version 0.1.0-dev --include-drafts --skip-validation --output build/release-preview

      - name: Upload preview release bundle
        uses: actions/upload-artifact@v4
        with:
          name: corpus-release-preview
          path: build/release-preview
          if-no-files-found: error
          retention-days: 7
