name: Validate corpus

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test coverage tooling
        run: python -m unittest discover -s tests -v

      - name: Validate corpus
        run: python tools/validate.py

      - name: Validate licensing and provenance
        run: python tools/validate_provenance.py

      - name: Validate role coverage and progression
        run: python tools/validate_coverage.py

      - name: Validate source topic traceability
        run: python tools/validate_source_topics.py

      - name: Build preview release bundle
        run: python tools/build_release.py --version 0.1.0-dev --include-drafts --skip-validation --output build/release-preview

      - name: Export coverage inventory
        run: |
          python tools/audit_role_coverage.py >> "$GITHUB_STEP_SUMMARY"
          python tools/audit_role_coverage.py --json > build/release-preview/swe-coverage-inventory.json

      - name: Finalize preview release metadata
        run: python tools/finalize_release_metadata.py --output build/release-preview

      - name: Upload preview release bundle
        uses: actions/upload-artifact@v7
        with:
          name: corpus-release-preview
          path: build/release-preview
          if-no-files-found: error
          retention-days: 7
