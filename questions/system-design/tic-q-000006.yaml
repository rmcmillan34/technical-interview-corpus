schema_version: 0.1.0
id: tic-q-000006
revision: 1
status: draft
question:
  prompt: >
    Design a highly available text-sharing service. A user submits a block of text and receives a short link;
    readers use that link to retrieve the text. Support optional expiry, a large read-heavy workload, and
    predictable low-latency reads. Explain your assumptions, API, data model, scaling approach, failure handling,
    and how you would evolve the design if traffic becomes highly skewed.
  domain: system-design
  response_modes:
  - discussion
  timebox_minutes: 35
classification:
  competencies:
    primary: software-architecture
    secondary:
    - distributed-systems
    - api-design
    - databases
    - reliability-engineering
    - performance-engineering
  roles:
  - swe
  - de
  - mle
  - ai-eng
  difficulty:
    level: D3
    drivers:
      implementation_depth: medium
      ambiguity: medium
      scope: high
      scale: high
      failure_reasoning: medium
      tradeoff_reasoning: high
    rationale: >
      The candidate must convert a bounded product scenario into a production architecture and reason about
      storage, read-heavy scale, expiry and failure behaviour without needing organisation-wide strategy.
  aspects:
  - requirements-elicitation
  - failure-mode-analysis
  - tradeoff-reasoning
  tags:
  - short-links
  - read-heavy
  - expiry
  - storage
assessment:
  intent: >
    Assess whether the candidate can scope and design a production service that maps short identifiers to stored
    content under asymmetric read/write load.
  must_surface:
  - clarifies scale, latency, durability and expiry requirements
  - defines a stable identifier and retrieval contract
  - chooses a data model that supports direct key-based lookup
  - explains cache and storage responsibilities
  - considers expiry/deletion and failure recovery
  strong_signals:
  - discusses hot-key behaviour and uneven traffic
  - distinguishes durability from cache availability
  - considers collision handling for generated identifiers
  - identifies observability and capacity signals
  - explains when replication or partitioning becomes necessary
  red_flags:
  - assumes traffic is evenly distributed
  - relies on cache as the system of record
  - omits identifier collision or uniqueness reasoning
  - provides no recovery path for storage failure
followups:
- id: f1
  prompt: One short link suddenly receives a million times the normal traffic. What changes first?
  axis: scale
  difficulty_effect: up
- id: f2
  prompt: How would you guarantee expired content is no longer returned if caches are involved?
  axis: consistency
  difficulty_effect: up
