schema_version: 0.1.0
id: tic-q-000090
revision: 1
status: draft
question:
  prompt: A small application sends email, SMS and push notifications. Decompose the notification capability into clear components and interfaces so a new delivery provider can be added without changing business logic throughout the codebase.
  domain: system-design
  response_modes: [discussion, written]
  timebox_minutes: 20
classification:
  competencies: {primary: software-architecture, secondary: [api-design, testing, technical-judgement]}
  roles: [swe]
  difficulty:
    level: D2
    drivers: {knowledge_depth: medium, implementation_depth: low, ambiguity: low, tradeoff_reasoning: medium}
    rationale: Applies boundaries and dependency inversion to a bounded extensibility problem.
  tags: [adapters, interfaces, notifications]
assessment:
  intent: Assess whether the candidate can isolate provider-specific details behind a stable application boundary.
  must_surface:
  - separates notification intent from provider-specific transport
  - defines a provider interface or adapter contract
  - keeps provider selection/configuration outside core business rules
  strong_signals:
  - considers contract tests or failure translation at the boundary
  red_flags:
  - scatters provider conditionals across unrelated business logic
