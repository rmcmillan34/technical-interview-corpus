    rationale: Applies image layering, build context and runtime-image concepts to a bounded build problem.
  tags: [dockerfile, multi-stage, build-cache]
assessment:
  intent: Assess whether the candidate can reduce image/build cost while preserving reproducibility.
  must_surface: [reduces unnecessary build context or files, orders stable dependency installation to benefit cache reuse, removes build-only tools or uses a smaller/multi-stage runtime image when appropriate]
  red_flags: [deletes dependencies merely to reduce size without preserving runtime behaviour]
