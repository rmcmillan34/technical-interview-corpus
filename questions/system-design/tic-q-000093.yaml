id: tic-q-000093
revision: 1
status: draft
question:
  prompt: Two modules must notify each other when an order changes state. Compare a direct synchronous call with publishing an asynchronous event for this bounded case. Choose one and explain the coupling, failure and consistency consequences.
  domain: system-design
  response_modes: [discussion]
  timebox_minutes: 20
classification:
  competencies: {primary: software-architecture, secondary: [distributed-systems, reliability-engineering, technical-judgement]}
  roles: [swe]
  difficulty:
    level: D2
    drivers: {knowledge_depth: medium, implementation_depth: low, ambiguity: medium, failure_reasoning: medium, tradeoff_reasoning: medium}
    rationale: Applies architectural interaction patterns and requires a justified choice under bounded constraints.
  tags: [sync, async, events, coupling]
assessment:
  intent: Assess whether the candidate understands the architectural consequences of synchronous versus asynchronous integration.
  must_surface:
  - synchronous calls couple availability and latency more directly
  - asynchronous events decouple timing but introduce delivery and consistency concerns
  strong_signals:
  - chooses based on business semantics rather than ideology
  red_flags:
  - treats asynchronous messaging as automatically more reliable
