schema_version: 0.1.0
id: tic-q-000102
revision: 1
status: draft
question:
  prompt: A profile service has one primary database and two read replicas. Product wants lower read latency but users expect to see their own profile edits immediately. Design a bounded read strategy that balances replica use with read-after-write expectations.
  domain: system-design
  response_modes: [discussion]
  timebox_minutes: 20
classification:
  competencies: {primary: distributed-systems, secondary: [databases, reliability-engineering, technical-judgement]}
  roles: [swe]
  difficulty:
    level: D2
    drivers: {knowledge_depth: medium, implementation_depth: low, ambiguity: medium, scale: medium, tradeoff_reasoning: medium}
    rationale: Applies replication and consistency concepts to a bounded client-visible requirement.
  tags: [replicas, read-after-write, consistency]
assessment:
  intent: Assess whether the candidate can choose a consistency strategy based on an explicit user guarantee.
  must_surface:
  - recognises replica lag can violate immediate read-after-write
  - proposes a bounded strategy such as primary reads after writes, session affinity, or version-aware routing
  strong_signals:
  - explains when ordinary reads can safely use replicas
  red_flags:
  - sends every read to replicas while promising immediate visibility
