schema_version: 0.1.0
id: tic-q-000007
revision: 1
status: draft
question:
  prompt: >
    Design the home-feed delivery path for a social platform. Users publish posts and followers expect a low-latency
    feed read. Most users have modest follower counts, but a small number have millions. Explain how you would model
    the data, distribute writes and reads, handle celebrity-scale fanout, recover from partial failure, and decide
    where precomputation is worthwhile.
  domain: system-design
  response_modes:
  - discussion
  timebox_minutes: 40
classification:
  competencies:
    primary: distributed-systems
    secondary:
    - software-architecture
    - data-modelling
    - performance-engineering
    - reliability-engineering
    - observability
  roles:
  - swe
  - de
  - mle
  - ai-eng
  difficulty:
    level: D4
    drivers:
      ambiguity: high
      scope: high
      scale: high
      failure_reasoning: high
      tradeoff_reasoning: high
      implementation_depth: medium
    rationale: >
      The candidate must resolve an intentionally uneven workload, compare fanout strategies and defend a hybrid
      architecture under scale and failure pressure.
  aspects:
  - requirements-elicitation
  - failure-mode-analysis
  - tradeoff-reasoning
  tags:
  - social-feed
  - fanout
  - hot-users
  - precomputation
assessment:
  intent: >
    Assess whether the candidate can reason about read/write amplification and asymmetric fanout in a large-scale feed.
  must_surface:
  - recognises the read-versus-write trade-off between push and pull fanout
  - addresses very high follower-count accounts separately from ordinary users
  - defines durable post storage independently from derived feed state
  - explains recovery when fanout work is delayed or partially fails
  strong_signals:
  - proposes and justifies a hybrid fanout strategy
  - discusses idempotent asynchronous fanout work
  - considers ordering, pagination and freshness semantics
  - identifies queue backlog, fanout latency and feed freshness telemetry
  - explains cache or materialised-feed invalidation trade-offs
  red_flags:
  - applies the same fanout strategy to every user without discussing skew
  - requires synchronous delivery to every follower before acknowledging a post
  - treats a materialised feed as the only durable copy of a post
  - ignores duplicate or failed fanout work
followups:
- id: f1
  prompt: A celebrity with 80 million followers posts during peak traffic. Walk through the failure modes in your design.
  axis: failure
  difficulty_effect: up
- id: f2
  prompt: Product now requires users to see a new post within five seconds. Which trade-offs change?
  axis: requirements
  difficulty_effect: same
