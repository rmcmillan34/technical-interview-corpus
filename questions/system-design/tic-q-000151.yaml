    level: D2
    drivers: {knowledge_depth: medium, ambiguity: medium, scope: medium, failure_reasoning: medium}
    rationale: Applies incremental delivery and compatibility evidence to a bounded multi-service dependency change.
  tags: [dependency-upgrade, compatibility, rollout]
assessment:
  intent: Assess whether the candidate can stage and verify a cross-service dependency change.
  must_surface: [tests compatibility before broad rollout, upgrades incrementally with observable checkpoints, retains a recovery path or compatible transition period]
  strong_signals: [uses contract fixtures dual-read/write or canary consumers where appropriate]
  red_flags: [upgrades every service simultaneously without compatibility evidence]
