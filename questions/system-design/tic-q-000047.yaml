schema_version: 0.1.0
id: tic-q-000047
revision: 1
status: draft
question:
  prompt: >
    A service must sort a 500 GB file of fixed-format records by a key on a machine with 8 GB of usable memory.
    Design a practical sorting process. Explain how you would partition work, sort intermediate runs, merge them,
    manage temporary storage, and recover if the process is interrupted after several hours.
  domain: system-design
  response_modes: [discussion]
  timebox_minutes: 30
classification:
  competencies:
    primary: algorithms-and-complexity
    secondary: [performance-engineering, reliability-engineering, service-operations, technical-judgement]
  roles: [swe]
  difficulty:
    level: D3
    drivers:
      knowledge_depth: medium
      implementation_depth: medium
      scope: medium
      scale: high
      failure_reasoning: medium
      tradeoff_reasoning: high
    rationale: Requires applying sorting fundamentals under realistic memory, I/O and restart constraints rather than merely naming an algorithm.
  aspects: [failure-mode-analysis, tradeoff-reasoning]
  tags: [external-sort, merge-sort, io, large-data]
assessment:
  intent: Assess whether the candidate can adapt an in-memory sorting concept into a robust external-memory workflow.
  must_surface:
  - creates sorted runs that fit in available memory
  - performs a k-way or staged merge rather than loading the full dataset at once
  - accounts for temporary disk capacity and sequential I/O behaviour
  - provides a checkpoint or restart strategy for long-running work
  strong_signals:
  - reasons about merge fan-in and file-handle or memory limits
  - preserves stable ordering if the record contract requires it
  - separates algorithmic complexity from practical I/O cost
  red_flags:
  - proposes loading all 500 GB into memory
  - ignores partial-output integrity or restart behaviour
  rubric:
  - {id: algorithm, criterion: Designs a correct external sorting workflow., importance: essential}
  - {id: resources, criterion: Reasons explicitly about memory, disk and I/O constraints., importance: essential}
  - {id: recovery, criterion: Makes the long-running process recoverable after interruption., importance: supporting}
