schema_version: 0.1.0
id: tic-q-000009
revision: 1
status: draft
question:
  prompt: >
    Design a distributed cache for expensive search or query results. The cache has limited memory, must serve very
    high read volume with low latency, and must remain useful when nodes fail or the popularity distribution shifts.
    Explain keying, eviction, partitioning, replication, cache-miss behaviour, invalidation or refresh, and how you
    would measure whether the cache is helping rather than hiding failures.
  domain: system-design
  response_modes:
  - discussion
  timebox_minutes: 35
classification:
  competencies:
    primary: distributed-systems
    secondary:
    - performance-engineering
    - reliability-engineering
    - observability
    - data-modelling
  roles:
  - swe
  - de
  - mle
  - ai-eng
  difficulty:
    level: D3
    drivers:
      ambiguity: medium
      scope: medium
      scale: high
      failure_reasoning: high
      tradeoff_reasoning: high
      implementation_depth: medium
    rationale: >
      The problem is bounded to a cache service but requires production reasoning about limited capacity,
      uneven demand, partitioning, node loss and stale data.
  aspects:
  - failure-mode-analysis
  - tradeoff-reasoning
  tags:
  - distributed-cache
  - eviction
  - hot-keys
  - invalidation
assessment:
  intent: >
    Assess whether the candidate can design a cache as an explicitly lossy performance layer while protecting
    correctness and availability of the underlying service.
  must_surface:
  - chooses a stable cache key and value contract
  - defines an eviction or admission strategy for limited capacity
  - explains cache-miss behaviour and fallback to the source of truth
  - addresses node loss and redistribution of cached keys
  - defines expiry, refresh or invalidation semantics
  strong_signals:
  - distinguishes cache availability from source-of-truth durability
  - discusses hot-key replication or request coalescing
  - considers thundering-herd behaviour after expiry or node loss
  - explains trade-offs between consistent hashing and simpler partitioning
  - proposes hit rate, miss latency, eviction rate and origin load metrics
  red_flags:
  - treats cached data as authoritative durable state
  - assumes LRU is always optimal without considering workload
  - ignores stampede behaviour on popular misses
  - provides no strategy for stale entries
followups:
- id: f1
  prompt: Half the cache nodes restart simultaneously. What happens to the backing service and how would you reduce the blast radius?
  axis: failure
  difficulty_effect: up
- id: f2
  prompt: A tiny set of keys accounts for 70 percent of traffic. What changes in your design?
  axis: scale
  difficulty_effect: same
