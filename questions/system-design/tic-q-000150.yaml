revision: 1
status: draft
question:
  prompt: A service needs to add a required database column without downtime while old and new application versions may run at the same time. Design a safe staged delivery sequence.
  domain: system-design
  response_modes: [discussion]
  timebox_minutes: 18
classification:
  competencies: {primary: software-delivery-practices, secondary: [databases, ci-cd, reliability-engineering]}
  roles: [swe]
  difficulty:
    level: D2
    drivers: {knowledge_depth: medium, ambiguity: medium, failure_reasoning: medium, tradeoff_reasoning: medium}
    rationale: Applies backward-compatible deployment sequencing to a bounded schema change.
  tags: [schema-migration, deployment, compatibility]
assessment:
  intent: Assess whether the candidate can sequence schema and application changes so mixed versions remain compatible.
  must_surface: [introduces backward-compatible schema first, deploys code that can operate during transition, backfills or validates before enforcing the new requirement]
  strong_signals: [defines rollback or forward-only constraints explicitly]
  red_flags: [makes the column required before any running application can populate it]
