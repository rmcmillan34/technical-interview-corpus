schema_version: 0.1.0
id: tic-q-000088
revision: 1
status: draft
question:
  prompt: Compare a monolithic deployment with a microservices architecture at a high level. What kinds of costs appear when a system is split into independently deployed services?
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 9
classification:
  competencies: {primary: software-architecture, secondary: [distributed-systems, service-operations, technical-judgement]}
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low, organisational_complexity: low}
    rationale: Requires explanation of foundational deployment and service-boundary trade-offs.
  tags: [monolith, microservices, boundaries]
assessment:
  intent: Assess whether the candidate understands that service decomposition trades local simplicity for distributed operational complexity.
  must_surface:
  - a monolith can deploy many modules as one application unit
  - microservices introduce network communication and independent deployment boundaries
  strong_signals:
  - mentions observability, failure modes, data ownership or deployment coordination as additional costs
  red_flags:
  - claims microservices are inherently more scalable or modern in every context
