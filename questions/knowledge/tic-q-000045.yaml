schema_version: 0.1.0
id: tic-q-000045
revision: 1
status: draft
question:
  prompt: >
    What is an algorithm invariant? Explain how an invariant can help you reason that a loop or iterative algorithm
    is correct, using the ideas of initialization, maintenance and termination.
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 8
classification:
  competencies:
    primary: algorithms-and-complexity
    secondary: [programming, testing, communication]
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: medium, implementation_depth: low, ambiguity: low}
    rationale: Requires conceptual reasoning about correctness without writing or formally proving an algorithm.
  tags: [invariants, correctness, loops]
assessment:
  intent: Assess whether the candidate can articulate a basic correctness argument rather than relying only on examples.
  must_surface:
  - an invariant is a property intended to remain true at a defined point in each iteration
  - initialization establishes the property before repeated work
  - maintenance preserves it and termination connects it to the desired result
  strong_signals:
  - gives a simple example such as maintaining a processed-prefix property
  red_flags:
  - treats an invariant as merely a test case
  rubric:
  - {id: concepts, criterion: Correctly explains the purpose and lifecycle of an algorithm invariant., importance: essential}
