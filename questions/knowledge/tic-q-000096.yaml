schema_version: 0.1.0
id: tic-q-000096
revision: 1
status: draft
question:
  prompt: What is a network partition in a distributed system, and why must software assume that remote calls can be slow, fail, or return after a caller has given up?
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 8
classification:
  competencies: {primary: distributed-systems, secondary: [networking, reliability-engineering]}
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low, failure_reasoning: low}
    rationale: Tests foundational partial-failure and network-fallibility concepts.
  tags: [partitions, partial-failure, timeouts]
assessment:
  intent: Assess whether the candidate understands that distributed failure is partial and ambiguous rather than process-local.
  must_surface:
  - a partition prevents some nodes from communicating while others may continue
  - a timeout does not prove whether the remote operation executed
  strong_signals:
  - connects ambiguity to retries or idempotency
  red_flags:
  - assumes a failed response means no remote side effect occurred
