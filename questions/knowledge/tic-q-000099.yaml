question:
  prompt: What is leader-based replication? Explain the basic roles of a leader and followers and what must happen when the leader becomes unavailable.
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 8
classification:
  competencies: {primary: distributed-systems, secondary: [reliability-engineering, databases]}
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low, failure_reasoning: low}
    rationale: Tests basic leader/follower and failover concepts.
  tags: [leader, followers, failover]
assessment:
  intent: Assess whether the candidate understands a common replication topology and failover need.
  must_surface:
  - the leader coordinates or accepts writes in a leader-based design
  - followers replicate state from the leader
  - a new leader may need to be selected after failure
  strong_signals:
  - notes that stale or split-brain leadership must be controlled
  red_flags:
  - assumes followers can all accept independent writes without extra coordination in the same model
