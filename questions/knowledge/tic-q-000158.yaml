  difficulty:
    level: D1
    drivers: {knowledge_depth: low, security_reasoning: low}
    rationale: Tests foundational allocation of cloud responsibilities.
  tags: [shared-responsibility, cloud-security]
assessment:
  intent: Assess whether the candidate understands that cloud providers and customers own different layers of risk.
  must_surface: [provider responsibility does not remove customer responsibility for identities configuration application code and data controls]
  red_flags: [assumes moving to cloud transfers all security responsibility to the provider]
