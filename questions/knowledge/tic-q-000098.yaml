question:
  prompt: Explain strong consistency and eventual consistency at a high level. What different client observations can occur under each model after a write?
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 8
classification:
  competencies: {primary: distributed-systems, secondary: [databases, communication]}
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low}
    rationale: Tests foundational consistency-model vocabulary without formal proofs.
  tags: [strong-consistency, eventual-consistency]
assessment:
  intent: Assess whether the candidate can describe visible consequences of different consistency guarantees.
  must_surface:
  - strong consistency gives clients a more immediate single-system-like view according to the stated model
  - eventual consistency allows replicas to converge after temporary divergence
  strong_signals:
  - avoids claiming eventual consistency means data may remain wrong forever
  red_flags:
  - equates consistency with durability
