question:
  prompt: What security properties should a user session or bearer access token have? Explain expiration, revocation and why possession of a bearer token matters.
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 8
classification:
  competencies: {primary: identity-and-access-control, secondary: [application-security, secrets-management]}
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, security_reasoning: low, ambiguity: low}
    rationale: Tests foundational session/token lifecycle concepts.
  tags: [sessions, access-tokens, bearer]
assessment:
  intent: Assess whether the candidate understands that session credentials are security-sensitive capabilities with lifecycles.
  must_surface: [tokens or sessions should be hard to predict or forge, bounded in lifetime according to risk, bearer-token possession can be sufficient to exercise its granted access]
  strong_signals: [mentions revocation/rotation strategy or secure storage/transport]
  red_flags: [assumes a bearer token is safe to expose because it is not a password]
