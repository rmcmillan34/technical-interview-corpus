schema_version: 0.1.0
id: tic-q-000100
revision: 1
status: draft
question:
  prompt: Compare at-most-once and at-least-once message delivery. Why is "exactly once" usually a stronger end-to-end claim than simply configuring a message broker?
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 8
classification:
  competencies: {primary: distributed-systems, secondary: [reliability-engineering, service-operations]}
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low, failure_reasoning: low}
    rationale: Tests foundational delivery-semantics concepts.
  tags: [messaging, delivery-semantics]
assessment:
  intent: Assess whether the candidate understands loss/duplication trade-offs and end-to-end processing semantics.
  must_surface:
  - at-most-once can lose work but avoids redelivery by contract
  - at-least-once can redeliver and therefore requires duplicate-safe handling
  strong_signals:
  - explains that broker delivery and application side effects are separate concerns
  red_flags:
  - treats exactly-once as a free broker switch for arbitrary external side effects
