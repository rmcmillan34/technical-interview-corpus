schema_version: 0.1.0
id: tic-q-000075
revision: 1
status: draft
question:
  prompt: What makes a test deterministic? Why can uncontrolled time, randomness, network calls or shared state make a test flaky?
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 8
classification:
  competencies: {primary: testing, secondary: [debugging, reliability-engineering]}
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low, failure_reasoning: low}
    rationale: Tests foundational understanding of deterministic and flaky tests.
  tags: [determinism, flaky-tests]
assessment:
  intent: Assess whether the candidate recognises common nondeterminism sources and why they undermine confidence.
  must_surface:
  - the same controlled inputs and state should produce repeatable outcomes
  - external time, randomness or services can vary independently of the code under test
  strong_signals:
  - mentions injecting clocks, seeds or fakes to control dependencies
  red_flags:
  - recommends simply retrying every flaky test indefinitely
