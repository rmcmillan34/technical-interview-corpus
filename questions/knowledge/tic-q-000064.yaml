id: tic-q-000064
revision: 1
status: draft
question:
  prompt: >
    Why do APIs paginate large collections? Compare offset-based and cursor-based pagination at a high level, including what can happen when data changes between requests.
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 8
classification:
  competencies:
    primary: api-design
    secondary: [databases, communication]
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low, scale: low}
    rationale: Tests foundational pagination concepts and their basic consistency trade-offs.
  tags: [pagination, cursors, offsets]
assessment:
  intent: Assess whether the candidate understands why pagination exists and the basic trade-offs of common approaches.
  must_surface:
  - pagination bounds response size and work
  - offset pagination uses position/count semantics while cursor pagination continues from a stable ordering marker
  strong_signals:
  - notes that inserts or deletes can cause duplicates or gaps with naive offset pagination
  red_flags:
  - assumes pagination is only a user-interface concern
  rubric:
  - id: tradeoffs
    criterion: Correctly explains offset and cursor pagination at a foundational level.
    importance: essential
