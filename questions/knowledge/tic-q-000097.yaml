question:
  prompt: Why do distributed systems replicate data? Explain the basic trade-off between having multiple copies for availability/read scale and keeping those copies consistent.
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 8
classification:
  competencies: {primary: distributed-systems, secondary: [reliability-engineering, databases]}
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low}
    rationale: Tests foundational replication purpose and consistency cost.
  tags: [replication, consistency]
assessment:
  intent: Assess whether the candidate understands why copies exist and why coordination is required.
  must_surface:
  - replication can improve availability, durability or read capacity
  - replicas can temporarily disagree without coordination
  strong_signals:
  - distinguishes synchronous from asynchronous replication conceptually
  red_flags:
  - assumes multiple copies remain identical automatically
