assessment:
  intent: Assess whether the candidate distinguishes indivisible operations from protecting multi-step shared-state invariants.
  must_surface: [atomicity concerns indivisible state transitions or operations, mutual exclusion can serialize a critical section spanning multiple pieces of shared state]
  red_flags: [assumes one atomic variable automatically makes any multi-variable invariant safe]
