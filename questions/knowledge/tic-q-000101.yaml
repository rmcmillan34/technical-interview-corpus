question:
  prompt: What is partitioning or sharding data across nodes? Explain why a good partition key matters and what a hot partition is.
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 8
classification:
  competencies: {primary: distributed-systems, secondary: [databases, performance-engineering]}
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low, scale: low}
    rationale: Tests foundational horizontal-partitioning concepts.
  tags: [sharding, partitioning, hot-keys]
assessment:
  intent: Assess whether the candidate understands how distributing data by key can create uneven load.
  must_surface:
  - a partitioning rule maps data or requests to different nodes
  - skewed keys can concentrate traffic or storage on one partition
  strong_signals:
  - mentions balancing locality against even distribution
  red_flags:
  - assumes adding shards automatically balances existing hot keys
