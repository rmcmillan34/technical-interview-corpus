assessment:
  intent: Assess whether the candidate can explain module responsibility and dependency quality.
  must_surface:
  - cohesion describes how closely related responsibilities within a module are
  - coupling describes dependency between modules
  strong_signals:
  - connects lower coupling to easier change, testing and replacement
  red_flags:
  - treats zero coupling as a realistic universal goal
