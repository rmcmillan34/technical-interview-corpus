id: tic-q-000089
revision: 1
status: draft
question:
  prompt: What problem do interfaces or dependency-inversion boundaries solve? Explain why depending on an abstraction can make a component easier to test or replace.
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 8
classification:
  competencies: {primary: software-architecture, secondary: [testing, programming, technical-judgement]}
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low}
    rationale: Tests basic dependency-boundary and substitution concepts.
  tags: [interfaces, dependency-inversion]
assessment:
  intent: Assess whether the candidate understands why stable boundaries reduce direct implementation coupling.
  must_surface:
  - callers depend on a contract rather than a concrete implementation detail
  - alternate implementations can satisfy the same contract
  strong_signals:
  - connects the boundary to test doubles or provider replacement without claiming every class needs an interface
  red_flags:
  - treats interfaces as useful only for inheritance
