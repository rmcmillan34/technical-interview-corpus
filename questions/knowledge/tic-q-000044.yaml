question:
  prompt: >
    Explain the divide-and-conquer pattern. What are the divide, solve and combine stages, and how does merge sort
    illustrate the pattern? You do not need to derive a recurrence formally.
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 7
