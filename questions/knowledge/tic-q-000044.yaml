    primary: algorithms-and-complexity
    secondary: [communication]
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low}
    rationale: Tests recognition of a common algorithm-design pattern using a familiar example.
  tags: [divide-and-conquer, merge-sort, recursion]
assessment:
  intent: Assess whether the candidate recognises recursive problem decomposition and recombination.
  must_surface:
  - divides a problem into smaller subproblems
  - solves the smaller problems and combines their results
  - merge sort recursively sorts halves and merges sorted results
  strong_signals:
  - connects repeated halving plus linear merge work to O(n log n) intuition
  red_flags:
  - treats divide-and-conquer as synonymous with any recursive function
  rubric:
  - {id: concepts, criterion: Correctly explains divide-and-conquer and the merge-sort example., importance: essential}
