schema_version: 0.1.0
id: tic-q-000078
revision: 1
status: draft
question:
  prompt: What is the difference between positive-path, negative-path and error-path testing? Why is testing only successful inputs insufficient?
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 7
classification:
  competencies: {primary: testing, secondary: [reliability-engineering, communication]}
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low, failure_reasoning: low}
    rationale: Tests basic coverage of expected success and failure behaviours.
  tags: [negative-testing, error-paths]
assessment:
  intent: Assess whether the candidate deliberately tests invalid inputs and failure behaviour as part of the contract.
  must_surface:
  - positive tests verify expected valid behaviour
  - negative or error tests verify rejection and failure handling
  strong_signals:
  - connects failure-path tests to contract guarantees and safe recovery
  red_flags:
  - assumes exceptions or invalid inputs do not need automated tests
