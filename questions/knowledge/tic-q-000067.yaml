schema_version: 0.1.0
id: tic-q-000067
revision: 1
status: draft
question:
  prompt: >
    Compare synchronous and asynchronous API operations. When might an API acknowledge work before the work is complete, and what extra contract does that create for the client?
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 8
classification:
  competencies:
    primary: api-design
    secondary: [distributed-systems, reliability-engineering, communication]
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low}
    rationale: Tests foundational request/response versus deferred-work semantics.
  tags: [async-api, jobs, polling]
assessment:
  intent: Assess whether the candidate understands why long-running work may require asynchronous API semantics.
  must_surface:
  - synchronous operations normally return the final result within the request lifecycle
  - asynchronous operations can acknowledge acceptance and expose later status or completion
  strong_signals:
  - mentions operation identifiers, polling, callbacks or event notification as possible completion contracts
  red_flags:
  - assumes returning success before completion means the work cannot later fail
  rubric:
  - id: semantics
    criterion: Correctly explains synchronous versus asynchronous API operation semantics.
    importance: essential
