assessment:
  intent: Assess whether the candidate understands address translation and demand paging at a basic level.
  must_surface: [virtual addresses are mapped to physical memory or other backing, a page fault occurs when required mapping or resident data needs operating-system handling]
  red_flags: [equates allocated virtual address space directly with resident RAM]
