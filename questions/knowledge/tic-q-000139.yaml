assessment:
  intent: Assess whether the candidate understands connection-oriented reliable byte streams versus datagram delivery.
  must_surface: [TCP provides ordered reliable byte-stream delivery within a connection, UDP does not provide those reliability or ordering guarantees]
  strong_signals: [notes that UDP can suit latency-sensitive or application-managed reliability cases]
  red_flags: [claims UDP guarantees delivery but is simply faster TCP]
