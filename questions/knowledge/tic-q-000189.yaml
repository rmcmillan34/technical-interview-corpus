question:
  prompt: >
    Given users(id) and logins(user_id, logged_at), write SQL to return users who have never logged in. Explain at least two valid query shapes and one NULL-related trap to avoid.
  domain: knowledge
  response_modes: [sql, discussion]
  timebox_minutes: 15
