schema_version: 0.1.0
id: tic-q-000082
revision: 1
status: draft
question:
  prompt: Explain how stack traces and structured logs can help localise a failure. What can each tell you, and what important information might still be missing?
  domain: knowledge
  response_modes: [discussion]
  timebox_minutes: 8
classification:
  competencies: {primary: debugging, secondary: [observability, communication]}
  roles: [swe]
  difficulty:
    level: D1
    drivers: {knowledge_depth: low, implementation_depth: low, ambiguity: low, failure_reasoning: low}
    rationale: Requires recognition and explanation of common debugging evidence sources.
  tags: [stack-traces, logs]
assessment:
  intent: Assess whether the candidate understands what execution-location and event-context evidence can and cannot establish.
  must_surface:
  - stack traces show a call path around an error point
  - logs can provide state, identifiers, timing and surrounding events
  strong_signals:
  - notes that either can be incomplete or misleading without request/context correlation
  red_flags:
  - assumes a stack trace alone always proves the originating defect
