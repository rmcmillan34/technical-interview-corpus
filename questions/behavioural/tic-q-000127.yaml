  tags: [code-review, disagreement]
assessment:
  intent: Assess whether the candidate can challenge feedback respectfully while preserving delivery and review quality.
  must_surface: [asks for the concern or decision criterion behind the request, explains the complexity trade-off with evidence and seeks a clear resolution]
  strong_signals: [offers a small experiment or alternative that addresses the underlying concern]
  red_flags: [dismisses the reviewer or implements unwanted complexity silently while remaining resentful]
