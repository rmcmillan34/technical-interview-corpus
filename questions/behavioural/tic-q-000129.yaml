  tags: [interpersonal-conflict, feedback]
assessment:
  intent: Assess whether the candidate addresses harmful collaboration behaviour specifically and proportionately.
  must_surface: [raises the observable behaviour and its impact rather than attacking intent, attempts direct resolution and agrees a workable behaviour change]
  strong_signals: [chooses an appropriate private setting and escalates only if direct repair fails or safety requires it]
  red_flags: [retaliates during meetings or avoids the issue indefinitely while impact continues]
