assessment:
  intent: Assess observable secrets-management evidence at D2.
  must_surface:
  - Use overlapping valid credentials or an explicitly supported rotation mechanism rather than assuming
    an instantaneous atomic switch.
  - Update and verify every consumer, including connection pools and background jobs, before retiring
    the old credential.
  - Revoke the old credential after the bounded migration; rollback must not silently restore an already
    revoked or compromised secret.
  red_flags:
  - Revokes the only live credential before checking consumers have switched.
