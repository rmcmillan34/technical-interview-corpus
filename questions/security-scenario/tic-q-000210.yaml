assessment:
  intent: Assess observable secrets-management evidence at D2.
  must_surface:
  - Revoke or rotate the credential, restrict the exposure and preserve appropriate incident evidence
    without copying the secret into tickets.
  - Identify consumers and inspect access audit evidence to assess possible misuse and restore them with
    scoped replacement credentials.
  - Verify the old credential is rejected and prevent recurrence through logging and pipeline controls;
    log deletion alone is insufficient.
  red_flags:
  - Focuses only on deleting the log while the credential remains valid.
  rubric:
